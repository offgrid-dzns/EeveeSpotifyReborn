name: Replace App Icon and Patch IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Dropbox folder link containing the .ipa"
        required: true
      icon_url:
        description: "Dropbox folder link containing the .png or .jpg"
        required: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup ipapatch
        run: |
          wget https://github.com/asdfzxcvbn/ipapatch/releases/download/v2.1.0/ipapatch.macos-arm64
          sudo mv ipapatch.macos-arm64 /usr/local/bin/ipapatch
          sudo chmod +x /usr/local/bin/ipapatch

      - name: Download IPA and Icon
        run: |
          mkdir downloads
          cd downloads

          IPA_URL="${{ github.event.inputs.ipa_url }}"
          ICON_URL="${{ github.event.inputs.icon_url }}"
          IPA_URL="${IPA_URL//dl=0/dl=1}"
          ICON_URL="${ICON_URL//dl=0/dl=1}"

          # Download all files in Dropbox folder
          curl -L "$IPA_URL" -o ipa.zip
          unzip ipa.zip || true

          curl -L "$ICON_URL" -o icon.zip
          unzip icon.zip || true

          # Validate IPA
          ipa_count=$(ls *.ipa 2>/dev/null | wc -l | xargs)
          if [ "$ipa_count" -ne 1 ]; then
            echo "::error::Dropbox folder must contain exactly 1 IPA, found $ipa_count"
            exit 1
          fi

          # Validate Icon
          img_count=$(ls *.png *.jpg *.jpeg 2>/dev/null | wc -l | xargs || true)
          if [ "$img_count" -ne 1 ]; then
            echo "::error::Dropbox folder must contain exactly 1 image (png/jpg), found $img_count"
            exit 1
          fi

          mv *.ipa app.ipa
          mv *.png *.jpg *.jpeg newicon.png || true

          cd ..

      - name: Patch IPA with New Icon
        run: |
          mkdir output
          ipapatch \
            -input downloads/app.ipa \
            -replace-icon downloads/newicon.png \
            -output output/App-with-new-icon.ipa

      - name: Upload Patched IPA
        uses: actions/upload-artifact@v4
        with:
          name: App-with-new-icon
          path: output/App-with-new-icon.ipa

      - name: Release Patched IPA
        uses: softprops/action-gh-release@v2
        with:
          files: output/App-with-new-icon.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
