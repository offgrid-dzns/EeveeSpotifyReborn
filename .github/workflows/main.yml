name: Change App Icon

on:
  workflow_dispatch:
    inputs:
      dropbox_folder_url:
        description: "Dropbox folder containing one .ipa and one .png/.jpg"
        required: true

jobs:
  replace-icon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick unzip zip wget jq

      - name: Download Dropbox contents
        run: |
          mkdir input
          cd input
          DL_URL="${{ github.event.inputs.dropbox_folder_url }}?dl=1"
          echo "Downloading from: $DL_URL"
          wget -O dropbox.zip "$DL_URL"
          unzip -l dropbox.zip
          unzip dropbox.zip
          cd ..

      - name: Find IPA and image
        run: |
          cd input
          IPA=$(ls *.ipa 2>/dev/null || true)
          IMG=$(ls *.png *.jpg 2>/dev/null || true)

          echo "Found IPA: $IPA"
          echo "Found Image: $IMG"

          if [ -z "$IPA" ] || [ -z "$IMG" ]; then
            echo "❌ Error: Missing IPA or image"
            exit 2
          fi

          if [ $(ls *.ipa | wc -l) -ne 1 ] || [ $(ls *.png *.jpg | wc -l) -ne 1 ]; then
            echo "❌ Error: More than one IPA or image found"
            exit 2
          fi

          echo "IPA=$IPA" >> $GITHUB_ENV
          echo "IMG=$IMG" >> $GITHUB_ENV
          cd ..

      - name: Extract IPA
        run: |
          mkdir work
          cd work
          unzip "../input/$IPA"
          ls -R

      - name: Replace icon
        run: |
          echo "Scaling new icon: $IMG"
          mkdir icons
          cp "input/$IMG" icons/newicon.png

          APP_DIR=$(find work/Payload -type d -name "*.app" | head -n 1)
          echo "App directory: $APP_DIR"

          if [ -z "$APP_DIR" ]; then
            echo "❌ Error: Could not find .app directory inside IPA"
            exit 2
          fi

          for size in 20 29 40 60 76 83.5 1024; do
            for scale in 1 2 3; do
              pixels=$(echo "$size * $scale" | bc | cut -d. -f1)
              echo "Generating ${pixels}x${pixels}..."
              convert icons/newicon.png -resize ${pixels}x${pixels} "$APP_DIR/AppIcon${size}x${size}@${scale}x.png" || true
            done
          done

      - name: Repack IPA
        run: |
          cd work
          zip -r "../modified.ipa" Payload
          cd ..
          ls -lh modified.ipa

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: modified-icon-${{ github.run_number }}
          name: "Modified IPA Run ${{ github.run_number }}"
          body: "This release contains the IPA with the replaced app icon."
          files: modified.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
