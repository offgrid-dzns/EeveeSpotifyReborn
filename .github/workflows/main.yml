name: Replace App Icon and Patch IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Dropbox folder link containing the .ipa"
        required: true
      icon_url:
        description: "Dropbox folder link containing the .png or .jpg"
        required: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew tap shinh/misc
          brew install ipapatch

      - name: Download files from Dropbox
        run: |
          mkdir downloads
          cd downloads

          # Clean Dropbox links (convert ?dl=0 -> ?dl=1 for direct download)
          IPA_URL="${{ github.event.inputs.ipa_url }}"
          ICON_URL="${{ github.event.inputs.icon_url }}"
          IPA_URL="${IPA_URL//dl=0/dl=1}"
          ICON_URL="${ICON_URL//dl=0/dl=1}"

          # Download IPA
          curl -L "$IPA_URL" -o app.ipa

          # Download Icon
          curl -L "$ICON_URL" -o newicon.png

          cd ..

      - name: Patch IPA with New Icon
        run: |
          mkdir output
          ipapatch \
            -input downloads/app.ipa \
            -replace-icon downloads/newicon.png \
            -output output/App-with-new-icon.ipa

      - name: Upload Patched IPA
        uses: actions/upload-artifact@v4
        with:
          name: App-with-new-icon
          path: output/App-with-new-icon.ipa

      - name: Release Patched IPA
        uses: softprops/action-gh-release@v2
        with:
          files: output/App-with-new-icon.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
