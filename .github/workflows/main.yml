name: Change App Icon

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct URL to the decrypted IPA file"
        default: ""
        required: true
        type: string
      icon_url:
        description: "Direct URL to the new App Icon (PNG/JPG)"
        default: ""
        required: true
        type: string

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2.0'

      - name: Hide Sensitive Inputs
        uses: levibostian/action-hide-sensitive-inputs@v1

      - name: Download and Validate IPA
        run: |
          wget "${{ inputs.ipa_url }}" --no-verbose -O spotify.ipa
          file_type=$(file --mime-type -b spotify.ipa)
          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            echo "::error::Validation failed: The downloaded file is not a valid IPA. Detected type: $file_type."
            exit 1
          fi

      - name: Download and Validate Icon
        run: |
          wget "${{ inputs.icon_url }}" --no-verbose -O newicon
          file_type=$(file --mime-type -b newicon)
          if [[ "$file_type" != "image/png" && "$file_type" != "image/jpeg" ]]; then
            echo "::error::Validation failed: The downloaded file is not a PNG/JPG. Detected type: $file_type."
            exit 1
          fi

      - name: Extract IPA
        run: |
          mkdir work
          cd work
          unzip ../spotify.ipa
          ls -R
          cd ..

      - name: Replace App Icon
        run: |
          brew install imagemagick

          APP_DIR=$(find work/Payload -type d -name "*.app" | head -n 1)
          echo "App directory: $APP_DIR"

          if [ -z "$APP_DIR" ]; then
            echo "::error::Could not find .app folder inside IPA"
            exit 1
          fi

          # Resize provided icon into all standard iOS sizes
          for size in 20 29 40 60 76 83.5 1024; do
            for scale in 1 2 3; do
              pixels=$(echo "$size * $scale" | bc | cut -d. -f1)
              convert newicon -resize ${pixels}x${pixels} "$APP_DIR/AppIcon${size}x${size}@${scale}x.png"
            done
          done

          echo "✅ Replaced app icons."

      - name: Repack IPA
        run: |
          cd work
          zip -r ../ModifiedApp.ipa Payload
          cd ..
          ls -lh ModifiedApp.ipa

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: icon-${{ github.run_number }}
          name: "IPA with New Icon (${{ github.run_number }})"
          files: ModifiedApp.ipa
          draft: true

      - name: Output Release URL
        run: |
          echo "::notice::Release available at: https://github.com/${{ github.repository }}/releases"
