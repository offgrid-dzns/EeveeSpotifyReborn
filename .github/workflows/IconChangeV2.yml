name: Create IPA with Custom Icon

on:
  workflow_dispatch:
    inputs:
      folder_url:
        description: "URL to folder containing IPA and Icon PNG"
        required: true
        type: string

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Make folders
        run: |
          mkdir downloads output

      - name: Download IPA and Icon
        run: |
          wget "${{ inputs.folder_url }}/app.ipa" -O downloads/app.ipa
          wget "${{ inputs.folder_url }}/icon.png" -O downloads/icon.png

      - name: Unzip IPA
        run: |
          cd downloads
          unzip -q app.ipa -d unpacked

      - name: Replace Icon
        run: |
          APP_PATH=$(find downloads/unpacked/Payload -type d -name "*.app" | head -n 1)
          cp downloads/icon.png "$APP_PATH/AppIcon60x60@2x.png"
          cp downloads/icon.png "$APP_PATH/AppIcon60x60@3x.png"
          cp downloads/icon.png "$APP_PATH/AppIcon76x76@2x.png"
          cp downloads/icon.png "$APP_PATH/AppIcon83.5x83.5@2x.png"
          cp downloads/icon.png "$APP_PATH/AppIcon1024x1024@1x.png"

      - name: Repack IPA without touching signatures
        run: |
          cd downloads/unpacked
          zip -qry "../../output/App-with-new-icon.ipa" *

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "App with New Icon (${{ github.run_number }})"
          files: output/App-with-new-icon.ipa
          draft: true
